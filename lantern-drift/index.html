<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Noto+Nastaliq+Urdu:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen night river (canvas) flowing toward the viewer; HUD sits lightly on top. Single committed night look. */
:root{
  --ink:#fff3e4; --ink-soft:rgba(255,243,228,.72); --line:rgba(255,243,228,.2);
  --gold:#ffd166; --flame:#ff9f43;
  --f-display:'Rozha One',Georgia,serif;
  --f-urdu:'Noto Nastaliq Urdu',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#06101c;color:var(--ink);font-family:var(--f-mono);font-size:13px}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:fixed;left:0;right:0;pointer-events:none;padding-inline:20px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top{top:calc(16px + env(safe-area-inset-top,0px))}
.bottom{bottom:calc(14px + env(safe-area-inset-bottom,0px));align-items:flex-end}
.hud > *{pointer-events:auto}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,60px);line-height:.9;margin:0;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.title h1 span{color:var(--gold)}
.title p{margin:8px 0 0;color:var(--ink-soft);line-height:1.6;max-width:40ch}
.stats{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:rgba(6,16,28,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--gold);font-weight:600}
button.chip{font:inherit;color:inherit;cursor:pointer}
button.chip:hover{border-color:var(--gold)}
button.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lau{display:inline-flex;align-items:center;gap:8px}
.lau i{display:block;width:70px;height:5px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.lau i em{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff6b3d,#ffd166)}
.hints{color:var(--ink-soft);font-size:12px;line-height:1.7;max-width:60ch}
.hints b{color:var(--ink);font-weight:500}
.urdu{font-family:var(--f-urdu);font-size:15px;color:var(--ink-soft)}
@media (max-width:640px){
  .title p{display:none}
  .stats{align-items:flex-start}
  .row{justify-content:flex-start}
  .hints{font-size:11px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="River game: drag to steer a paper boat, collect floating diyas to keep your flame alive, avoid whirlpools, rocks and logs"></canvas>

<div class="hud top">
  <div class="title">
    <h1>Lantern <span>Drift</span></h1>
    <p>Raat ka Ravi. Aap ki kaghaz ki kashti mein ek chhota sa diya hai. Darya ke diye uthao, lau jalti rakho.</p>
  </div>
  <div class="stats">
    <div class="row"><span class="chip">diye <b id="sDiye">0</b></span><span class="chip">combo <b id="sCombo">–</b></span><span class="chip">best <b id="sBest">0</b></span></div>
    <div class="row"><span class="chip lau">lau <i><em id="sLau"></em></i></span><button class="chip" id="soundBtn" type="button" aria-pressed="true">sound: on</button></div>
  </div>
</div>

<div class="hud bottom">
  <div class="hints"><b>drag</b> to steer · diye jaldi jaldi uthao for <b>combo</b> · <b>bhanwar</b> pulls you in, chattan aur lakdi se bacho · arrows/WASD too</div>
  <div class="urdu" lang="ur">دریا کے دیے</div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let W = 0, H = 0, DPR = 1, bankL = 0, bankR = 0;

/* ---------------- State ---------------- */
const BEST_KEY = 'lantern-drift-best-v2';
let best = 0; try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) {}
let state = 'ready', T = 0, overT = 0;
let dist = 0, speed = 0, points = 0, diyaCount = 0, combo = 0, comboT = 0, flame = 100, inv = 0, shake = 0, nextChunk = 0;
let boat = null, diyas = [], pools = [], rocks = [], logs = [], sparks = [], shouts = [], streaks = [], trail = [], deco = [];
const pointer = { x: 0, y: 0, active: false, touch: false };
const keys = {};

const difficulty = () => clamp(dist / 7000, 0, 1);
const score = () => points + Math.floor(dist / 40);

/* ---------------- Spawning ---------------- */
function addDiya(x, y, gold = false){ diyas.push({ x, y, gold, ph: rnd(0, 6) }); }

function spawnChunk(y0){
  const d = difficulty(), lo = bankL + 40, hi = bankR - 40, r = Math.random();
  if (r < 0.32 - d * 0.1){                       // a winding line of diyas
    const x0 = rnd(lo + 30, hi - 30), n = 4 + Math.floor(rnd(0, 3)), amp = rnd(20, 60);
    for (let i = 0; i < n; i++) addDiya(clamp(x0 + Math.sin(i * 0.9) * amp, lo, hi), y0 - i * 46, i === n - 1 && Math.random() < 0.12);
  } else if (r < 0.58){                          // bhanwar ringed with diyas: risk for reward
    const R = rnd(32, 46) + d * 10, x = rnd(lo + R, hi - R);
    pools.push({ x, y: y0 - R * 2, R, spin: Math.random() < 0.5 ? 1 : -1 });
    const n = 7;
    for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; addDiya(clamp(x + Math.cos(a) * R * 1.75, lo, hi), y0 - R * 2 + Math.sin(a) * R * 1.75, i === 0 && Math.random() < 0.35); }
  } else if (r < 0.82){                          // rock gate with diyas through the gap
    const gap = rnd(120, 160) - d * 35, gx = rnd(lo + gap / 2, hi - gap / 2);
    for (let x = lo - 10; x < gx - gap / 2 - 10; x += rnd(42, 60)) rocks.push({ x, y: y0 + rnd(-10, 10), r: rnd(16, 24), seed: Math.random() });
    for (let x = hi + 10; x > gx + gap / 2 + 10; x -= rnd(42, 60)) rocks.push({ x, y: y0 + rnd(-10, 10), r: rnd(16, 24), seed: Math.random() });
    for (let i = 0; i < 3; i++) addDiya(gx, y0 + 70 - i * 70);
  } else {                                       // drifting log with diyas scattered behind it
    const fromLeft = Math.random() < 0.5, len = rnd(80, 130);
    logs.push({ x: fromLeft ? lo - 20 : hi + 20, y: y0, vx: (fromLeft ? 1 : -1) * rnd(40, 80 + d * 60), len, ang: rnd(-0.3, 0.3), spin: rnd(-0.4, 0.4) });
    for (let i = 0; i < 2; i++) addDiya(rnd(lo, hi), y0 - 90 - i * 60);
  }
  if (Math.random() < d * 0.6) rocks.push({ x: rnd(lo, hi), y: y0 - rnd(120, 200), r: rnd(14, 20), seed: Math.random() });
}
